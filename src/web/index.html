<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%A4%96%3C/text%3E%3C/svg%3E" />
<title>AI 模拟炒股盘 · 10 万实盘数据模拟</title>
<style>
  :root{
    --bg:#0a0e14; --panel:#111823; --panel2:#161f2c; --line:#22303f;
    --txt:#e6edf5; --dim:#8296ab; --up:#ff4d4f; --down:#12b886; --accent:#3d8bfd;
    --warn:#f0a020;
    --mono:"JetBrains Mono","Cascadia Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:14px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  a{color:var(--accent);text-decoration:none}
  .wrap{max-width:1280px;margin:0 auto;padding:20px 18px 60px}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  h1{font-size:19px;margin:0;letter-spacing:.3px}
  .pill{font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;color:var(--dim)}
  .pill.live{color:var(--down);border-color:#1d4a3a;background:#0d2019}
  .pill.warn{color:var(--warn);border-color:#4a3a1d;background:#201a0d}
  .grow{flex:1}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
    border-radius:8px;padding:7px 13px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent)}
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(168px,1fr));margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card .lbl{font-size:12px;color:var(--dim);margin-bottom:7px;letter-spacing:.4px}
  .card .val{font:600 25px/1.2 var(--mono)}
  .card .sub{font-size:12px;color:var(--dim);margin-top:5px}
  .up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--dim)}
  .two{grid-template-columns:1.05fr .95fr}
  .two-w{grid-template-columns:1.6fr 1fr}
  @media(max-width:900px){.two,.two-w{grid-template-columns:1fr}}
  .sect{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
  .sect h2{font-size:15px;margin:0;letter-spacing:.3px}
  .sect .hint{font-size:12px;color:var(--dim)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:right;color:var(--dim);font-weight:500;font-size:12px;padding:8px 10px;
    border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  td{padding:9px 10px;border-bottom:1px solid #1a2431;text-align:right;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  tbody tr:hover{background:#141d29}
  .name{font-weight:600}
  .code{font:11px var(--mono);color:var(--dim)}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;
    border:1px solid var(--line);color:var(--dim);margin-left:6px}
  .tag.hold{color:var(--accent);border-color:#1d3a5c}
  .mono{font-family:var(--mono)}
  .empty{color:var(--dim);padding:18px 4px;font-size:13px}
  .log{max-height:340px;overflow:auto;padding-right:4px}
  .log .item{padding:9px 0;border-bottom:1px solid #1a2431;font-size:12.5px}
  .log .t{font:11px var(--mono);color:var(--dim);margin-right:8px}
  .rules{font-size:12.5px;color:var(--dim);line-height:1.9;margin:0;padding-left:20px}
  .rules b{color:var(--txt);font-weight:600}
  .bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:8px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#3d8bfd,#12b886)}
  .chart{width:100%;height:170px;display:block}
  .banner{background:linear-gradient(90deg,#1a2333,#111823);border:1px solid var(--line);
    border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:13px;color:var(--dim)}
  .banner b{color:var(--txt)}
  footer{margin-top:28px;color:var(--dim);font-size:12px;line-height:1.8}
  .flash{animation:fl 1s ease}@keyframes fl{from{background:#1b2b3f}to{background:transparent}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🤖 AI 模拟炒股盘</h1>
    <span class="pill" id="mode">本金 10 万 · 真实行情 · 本地撮合</span>
    <span class="pill" id="asof">—</span>
    <div class="grow"></div>
    <span class="pill" id="clock">—</span>
    <button onclick="refresh(true)">刷新</button>
  </header>

  <div class="banner" id="banner">加载中…</div>

  <div class="grid kpis" id="kpis"></div>

  <div class="sect"><h2>净值走势</h2><span class="hint" id="chartHint">账户总资产 vs 上证指数</span></div>
  <div class="card"><svg class="chart" id="chart" viewBox="0 0 1000 170" preserveAspectRatio="none"></svg></div>

  <div class="sect"><h2>持仓</h2><span class="hint" id="posHint"></span></div>
  <div class="card" style="padding:6px 6px 2px">
    <table>
      <thead><tr>
        <th>标的</th><th>持股</th><th>成本价</th><th>现价</th><th>市值</th>
        <th>浮动盈亏</th><th>收益率</th><th>动能排名</th>
      </tr></thead>
      <tbody id="posBody"></tbody>
    </table>
  </div>

  <div class="sect"><h2>待执行计划</h2><span class="hint">下个交易日开盘按开盘价成交</span></div>
  <div class="card" style="padding:6px 6px 2px">
    <table><thead><tr><th>方向</th><th>标的</th><th>执行日</th><th>理由</th></tr></thead>
    <tbody id="planBody"></tbody></table>
  </div>

  <div class="sect"><h2>候选排名</h2><span class="hint" id="scanHint"></span></div>
  <div class="card" style="padding:6px 6px 2px">
    <table><thead><tr><th>#</th><th>标的</th><th>得分</th><th>20日</th><th>60日</th><th>波动率</th><th>现价</th></tr></thead>
    <tbody id="scanBody"></tbody></table>
  </div>

  <div class="sect"><h2>成交记录</h2><span class="hint" id="tradeHint"></span></div>
  <div class="card" style="padding:6px 6px 2px">
    <table><thead><tr>
      <th>日期</th><th>标的</th><th>方向</th><th>数量</th><th>成交价</th>
      <th>费用</th><th>金额</th><th>实现盈亏</th><th>理由</th>
    </tr></thead><tbody id="tradeBody"></tbody></table>
  </div>

  <div class="sect"><h2>决策日志</h2><span class="hint">AI 每一步的原始记录</span></div>
  <div class="card"><div class="log" id="log"></div></div>

  <div class="sect"><h2>策略规则（固定不变，可复盘）</h2></div>
  <div class="card"><ol class="rules" id="rules"></ol></div>

  <footer>
    数据来源：腾讯行情 / 东方财富公开行情接口。成交价按“开盘价 ± 0.1% 滑点”模拟，含佣金与印花税。
    本页仅为模拟交易演示，不构成任何投资建议。
  </footer>
</div>

<script>
const fmt = (n, d = 2) => (n === null || n === undefined || Number.isNaN(n)) ? '—'
  : Number(n).toLocaleString('zh-CN', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (x, d = 2) => (x === null || x === undefined) ? '—' : (x >= 0 ? '+' : '') + (x * 100).toFixed(d) + '%';
const cls = (x) => x == null ? 'muted' : x > 0 ? 'up' : x < 0 ? 'down' : 'muted';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let lastTotal = null;

function render(v) {
  const a = v.account;
  document.getElementById('clock').textContent = v.serverTime;
  document.getElementById('asof').textContent = v.scan ? '行情截止 ' + v.scan.asOf : '尚未扫描';

  const w = v.scan?.weather;
  const bm = v.benchmark;
  const alpha = bm ? a.pnlPct - bm.ret : null;
  document.getElementById('banner').innerHTML = w
    ? `市场环境：上证指数 <b>${fmt(w.indexClose)}</b> vs 20日均线 <b>${fmt(w.ma20)}</b> →
       <b class="${w.above ? 'up' : 'down'}">${w.above ? '多头（正常开仓）' : '空头（分数减半 + 弱势限购 1 只 + 初始仓位 60%）'}</b>
       　|　近5日 <b class="${cls(w.chg5)}">${pct(w.chg5)}</b>
       　|　全市场 <b>${v.scan.universeCount}</b> → 硬筛 <b>${v.scan.filteredCount}</b> → 细算 <b>${v.scan.scoredCount}</b>
       　|　数据源 <b>${esc(v.scan.dataSource || '—')}</b>${v.scan.adjusted === false ? ' <span class="down">(未复权)</span>' : ''}`
    : '尚未完成首次扫描。';

  const kpi = [
    ['总资产', fmt(a.total), `本金 ${fmt(a.initialCapital,0)} 元`, ''],
    ['总盈亏', (a.pnl>=0?'+':'') + fmt(a.pnl), pct(a.pnlPct) + ' 　(未实现 ' + (a.unrealized>=0?'+':'') + fmt(a.unrealized) + ')', cls(a.pnl)],
  ];
  document.getElementById('kpis').innerHTML = kpi.map(([l,val,sub,c]) => `
    <div class="card"><div class="lbl">${l}</div>
      <div class="val ${c}">${val}</div><div class="sub">${sub}</div></div>`).join('')
    + `<div class="card" id="vsbm">${bm
        ? `<div class="lbl">对比基准（等权持有同样标的）</div>
           <div class="val ${cls(alpha)}">${alpha>=0?'领先':'落后'} ${(Math.abs(alpha)*100).toFixed(2)}%</div>
           <div class="sub">基准收益 ${pct(bm.ret)}（${fmt(bm.total)} 元）· 我的 ${pct(a.pnlPct)}</div>`
        : `<div class="lbl">对比基准</div><div class="val muted">—</div><div class="sub">初始化时未记录基准</div>`}</div>`
    + [
    ['可用资金', fmt(a.cash), '仓位 ' + (a.positionPct*100).toFixed(1) + '%', ''],
    ['已实现盈亏', (a.realized>=0?'+':'') + fmt(a.realized), '累计手续费 ' + fmt(a.feesPaid), cls(a.realized)],
    ['胜率', a.winRate==null ? '—' : (a.winRate*100).toFixed(0) + '%', `盈 ${a.winCount} / 亏 ${a.lossCount} 笔`, a.winRate==null?'muted':(a.winRate>=0.5?'up':'down')],
    ['成交笔数', String(a.tradeCount), a.startedAt ? '起始 ' + a.startedAt : '', ''],
  ].map(([l,val,sub,c]) => `
    <div class="card"><div class="lbl">${l}</div>
      <div class="val ${c}">${val}</div><div class="sub">${sub}</div></div>`).join('');

  // 持仓
  const pb = document.getElementById('posBody');
  document.getElementById('posHint').textContent = v.positions.length
    ? `${v.positions.length} 只持仓，市值 ${fmt(a.mktValue)} 元` : '当前空仓';
  pb.innerHTML = v.positions.length ? v.positions.map(p => `
    <tr>
      <td><span class="name">${esc(p.name)}</span><span class="code">${p.code}</span></td>
      <td>${p.shares}</td>
      <td class="mono">${fmt(p.avgCost,3)}</td>
      <td class="mono">${fmt(p.price,3)}</td>
      <td class="mono">${fmt(p.value)}</td>
      <td class="mono ${cls(p.pnl)}">${p.pnl>=0?'+':''}${fmt(p.pnl)}</td>
      <td class="${cls(p.pnlPct)}">${pct(p.pnlPct)}</td>
      <td>${p.rank ? '第 '+p.rank+' 名' : '<span class="muted">掉出候选</span>'}</td>
    </tr>`).join('') : '<tr><td colspan="8" class="empty">空仓中</td></tr>';

  // 待办
  const plb = document.getElementById('planBody');
  plb.innerHTML = (v.pending||[]).length ? v.pending.map(p => `
    <tr>
      <td><span class="tag ${p.action==='buy'?'':'hold'}">${p.action==='buy'?'买入':'卖出'}</span></td>
      <td><span class="name">${esc(p.name)}</span><span class="code">${p.code}</span></td>
      <td class="mono">${p.execDate}</td>
      <td style="text-align:left;white-space:normal;color:#b9c8d8">${esc(p.reason)}</td>
    </tr>`).join('') : '<tr><td colspan="4" class="empty">无待执行计划</td></tr>';

  // 候选
  const sc = v.scan?.candidates || [];
  document.getElementById('scanHint').textContent = v.scan
    ? `扫描于 ${new Date(v.scan.at).toLocaleString('zh-CN')} · 市场开关 ×${fmt(w?.gate,2)}${w&&!w.above?'（弱势已折半）':''}`
    : '';
  const held = new Set(v.heldCodes);
  document.getElementById('scanBody').innerHTML = sc.length ? sc.map((c,i) => `
    <tr>
      <td class="mono">${i+1}</td>
      <td><span class="name">${esc(c.name)}</span><span class="code">${c.code}</span>${held.has(c.code)?'<span class="tag hold">持仓</span>':''}</td>
      <td class="mono">${fmt(c.score,3)}</td>
      <td class="${cls(c.r20)}">${pct(c.r20)}</td>
      <td class="${cls(c.r60)}">${pct(c.r60)}</td>
      <td class="muted">${(c.vol*100).toFixed(1)}%</td>
      <td class="mono">${fmt(c.close)}</td>
    </tr>`).join('') : '<tr><td colspan="7" class="empty">暂无扫描结果</td></tr>';

  // 成交
  document.getElementById('tradeHint').textContent = `${v.trades.length} 笔`;
  document.getElementById('tradeBody').innerHTML = v.trades.length ? v.trades.map(t => `
    <tr>
      <td class="mono">${t.date}</td>
      <td><span class="name">${esc(t.name)}</span><span class="code">${t.code}</span></td>
      <td class="${t.side==='buy'?'up':'down'}">${t.side==='buy'?'买入':'卖出'}</td>
      <td>${t.shares}</td>
      <td class="mono">${fmt(t.price,3)}</td>
      <td class="mono muted">${fmt(t.fee)}</td>
      <td class="mono">${fmt(t.amount)}</td>
      <td class="mono ${t.side==='sell'?cls(t.pnl):'muted'}">${t.side==='sell'?(t.pnl>=0?'+':'')+fmt(t.pnl):'—'}</td>
      <td style="text-align:left;white-space:normal;max-width:330px;color:#9fb0c2;font-size:12px">${esc(t.reason)}</td>
    </tr>`).join('') : '<tr><td colspan="9" class="empty">还没有成交</td></tr>';

  // 日志
  document.getElementById('log').innerHTML = (v.events||[]).map(e => `
    <div class="item"><span class="t">${esc(e.at)}</span>${esc(e.msg)}</div>`).join('') ||
    '<div class="empty">暂无日志</div>';

  // 规则
  document.getElementById('rules').innerHTML = (v.strategy?.rules||[]).map(r => `<li>${esc(r)}</li>`).join('');

  drawChart(v.snapshots || [], a.initialCapital);
}

function drawChart(snaps, init) {
  const svg = document.getElementById('chart');
  if (!snaps || snaps.length < 2) {
    svg.innerHTML = '<text x="500" y="90" text-anchor="middle" fill="#8296ab" font-size="13">数据点不足，无法绘制曲线</text>';
    document.getElementById('chartHint').textContent = '需至少 2 个交易日数据';
    return;
  }
  document.getElementById('chartHint').textContent = `${snaps.length} 个交易日 · 账户总资产 vs 上证指数（归一化）`;
  const W = 1000, H = 170, P = 10;
  const totals = snaps.map(s => s.total);
  const idxs = snaps.map(s => s.index).filter(x => x);
  const tMin = Math.min(...totals, init), tMax = Math.max(...totals, init);
  const iMin = idxs.length ? Math.min(...idxs) : 0, iMax = idxs.length ? Math.max(...idxs) : 1;
  const x = i => P + (W - 2*P) * (snaps.length === 1 ? 0 : i / (snaps.length - 1));
  const yT = v => H - P - (H - 2*P) * ((v - tMin) / Math.max(1e-9, tMax - tMin));
  const yI = v => H - P - (H - 2*P) * ((v - iMin) / Math.max(1e-9, iMax - iMin));
  const path = (arr, f) => arr.map((v,i) => (i?'L':'M') + x(i).toFixed(1) + ' ' + f(v).toFixed(1)).join(' ');
  const idxPath = idxs.length === snaps.length ? path(idxs, yI) : '';
  const base = yT(init);
  svg.innerHTML = `
    <line x1="0" y1="${base.toFixed(1)}" x2="${W}" y2="${base.toFixed(1)}" stroke="#3a4a5e" stroke-dasharray="5 5" stroke-width="1"/>
    ${idxPath ? `<path d="${idxPath}" fill="none" stroke="#5a6b80" stroke-width="1.4" opacity="0.85"/>` : ''}
    <path d="${path(totals, yT)} L ${x(snaps.length-1)} ${H-P} L ${x(0)} ${H-P} Z" fill="url(#g)" opacity="0.28"/>
    <path d="${path(totals, yT)}" fill="none" stroke="#3d8bfd" stroke-width="2.2"/>
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d8bfd"/><stop offset="100%" stop-color="#0a0e14" stop-opacity="0"/>
    </linearGradient></defs>
    <text x="${W-P}" y="14" text-anchor="end" fill="#8296ab" font-size="11">— 账户总资产　— 上证指数</text>
    <text x="${P+2}" y="${(base-5).toFixed(1)}" fill="#5a6b80" font-size="11">本金线</text>`;
}

async function refresh(manual) {
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    const v = await r.json();
    render(v);
    if (manual) document.getElementById('mode').classList.add('flash');
  } catch (e) {
    console.error(e);
  }
}
refresh();
setInterval(() => refresh(false), 15000);
</script>
</body>
</html>
